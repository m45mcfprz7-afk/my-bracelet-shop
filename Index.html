<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Bracelet Shop</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #fff8fb;

      color: #333;

      text-align: center;

    }

    header {

      background: #f3b6cf;

      padding: 35px 20px;

    }

    header h1 {

      margin: 0;

      font-size: 34px;

      color: white;

    }

    header p {

      color: white;

      font-size: 17px;

    }

    .product {

      max-width: 500px;

      margin: 35px auto;

      padding: 25px;

      background: white;

      border-radius: 20px;

      box-shadow: 0 5px 20px rgba(0,0,0,0.1);

    }

    .bracelet {

      width: 100%;

      max-width: 350px;

      border-radius: 18px;

      margin-bottom: 20px;

    }

    h2 {

      font-size: 28px;

      color: #d45b91;

    }

    .description {

      font-size: 17px;

      line-height: 1.6;

    }

    .price {

      font-size: 28px;

      font-weight: bold;

      color: #d45b91;

      margin: 20px 0;

    }

    .order {

      display: inline-block;

      background: #25D366;

      color: white;

      text-decoration: none;

      padding: 15px 30px;

      border-radius: 30px;

      font-size: 18px;

      font-weight: bold;

    }

    .order:hover {

      opacity: 0.85;

    }

    footer {

      margin-top: 30px;

      padding: 20px;

      background: #f3b6cf;

      color: white;

    }

  </style>

</head>

<body>

  <header>

    <h1>My Bracelet Shop ✨</h1>

    <p>Beautiful bracelets made to complete your look.</p>

  </header>

  <div class="product">

    <img

      class="bracelet"

      src="https://via.placeholder.com/350x350.png?text=Your+Bracelet"

      alt="Beautiful bracelet">

    <h2>Beautiful Fashion Bracelet</h2>

    <p class="description">

      Add a touch of elegance to your everyday style with this beautiful

      bracelet. Perfect for yourself or as a lovely gift for someone special. 💕

    </p>

    <div class="price">GH₵50</div>

    <a

      class="order"

      href="https://wa.me/233XXXXXXXXX?text=Hello!%20I%20want%20to%20order%20the%20bracelet."

      target="_blank">

      Order on WhatsApp 💬

    </a>

  </div>

  <footer>

    <p>Thank you for shopping with us 💕</p>

  </footer>

</body>

</html>
